name: Build

# Builds the JVM/desktop JNI library on each OS, verifies the wasmJs target,
# and assembles a cross-OS desktop jar.
on:
  push:
  workflow_dispatch:

# Newer runs on a branch cancel any still-in-progress run on the same branch,
# so superseded commits don't tie up the (slow) per-OS native build matrix.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-native:
    name: llamakmp-jni (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   platform: macos }
          - { os: ubuntu-latest,  platform: linux }
          - { os: windows-latest, platform: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # GPU backend (Vulkan) needs the LunarG SDK for glslc; macOS uses Metal instead.
      - name: Install Vulkan SDK (Linux)
        if: matrix.platform == 'linux'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          curl.exe -L -o "$env:RUNNER_TEMP\VulkanSDK.exe" https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe
          & "$env:RUNNER_TEMP\VulkanSDK.exe" --accept-licenses --default-answer --confirm-command install
          $sdk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build desktop JNI native
        run: ./gradlew :core:copyDesktopJni --console=plain
      - name: Upload per-OS native
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          # Upload the `native/` parent so the artifact keeps its <os>/ subfolder.
          path: core/build/generated/jvmNativeResources/native

  wasm:
    name: wasmJs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build wasmJs
        run: ./gradlew :core:wasmJsJar :koog:compileKotlinWasmJs --console=plain

  # Builds the Apple static libs and runs cinterop + the iOS Kotlin compiles that
  # publish.yml publishes (mirrors the whisper.cpp-kmp apple job).
  apple:
    name: Apple static libs + iOS Kotlin compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Configuring the :core/:koog Android targets needs the SDK even for iOS tasks,
      # and macOS runners ship without it.
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build llama.cpp Apple static libs
        run: bash native/cpp/build-ios.sh
      - name: Compile iOS Kotlin targets (cinterop + klibs)
        run: >
          ./gradlew
          :core:compileKotlinIosArm64 :core:compileKotlinIosSimulatorArm64
          :koog:compileKotlinIosArm64 :koog:compileKotlinIosSimulatorArm64
          --console=plain

  android:
    name: Android native (.so arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The :native CMake build pins these (native/build.gradle.kts); install the exact
      # versions so the Android cross-compile (which the JVM/desktop path never exercises)
      # is verified in CI — this job is what catches Android-only JNI/linker regressions.
      - name: Install NDK + CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.31.6"
      - name: Build Android native (.so for both ABIs via CMake) + Android Kotlin
        run: ./gradlew :native:assembleRelease :core:compileAndroidMain :koog:compileAndroidMain --console=plain

  jvm-jar:
    name: JVM jar (all-OS natives bundled)
    needs: [desktop-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Download all per-OS natives
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: core/build/generated/jvmNativeResources/native
      - name: Bundle the JVM jar with macOS + Linux + Windows natives
        run: ./gradlew :core:jvmJar :koog:compileKotlinJvm -PllamakmpPrebuiltNatives=true --console=plain
      - name: Upload JVM jar
        uses: actions/upload-artifact@v7
        with:
          name: llama-cpp-kmp-jvm
          path: core/build/libs/*.jar
