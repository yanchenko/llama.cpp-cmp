name: Publish

on:
  release:
    types: [released, prereleased]

permissions:
  contents: write # upload per-target artifacts to the release page

jobs:
  desktop-native:
    name: llamakmp-jni (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   platform: macos }
          - { os: ubuntu-latest,  platform: linux }
          - { os: windows-latest, platform: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install Vulkan SDK (Linux)
        if: matrix.platform == 'linux'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          curl.exe -L -o "$env:RUNNER_TEMP\VulkanSDK.exe" https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe
          & "$env:RUNNER_TEMP\VulkanSDK.exe" --accept-licenses --default-answer --confirm-command install
          $sdk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build desktop JNI native
        run: ./gradlew :core:copyDesktopJni --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: core/build/generated/jvmNativeResources/native

  publish:
    name: Release build and publish
    needs: [desktop-native]
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The publish builds the Android AAR (via :native's CMake/NDK build), and macOS
      # runners ship without the Android SDK — install it plus the pinned NDK/CMake.
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages (NDK + CMake pinned by :native)
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
      - name: Download desktop natives (macOS + Linux + Windows)
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: core/build/generated/jvmNativeResources/native
      - name: Build iOS artifacts
        run: cd native/cpp && sh build-ios.sh
      - name: Publish to Maven Local + Central (all modules, all platforms)
        run: >
          ./gradlew publishToMavenLocal publishToMavenCentral
          -PllamakmpPrebuiltNatives=true
          -PVERSION_NAME=${{ github.ref_name }}
          -PmavenCentralUsername=${{ secrets.MAVEN_USERNAME }}
          -PmavenCentralPassword=${{ secrets.MAVEN_PASSWORD }}
          -PsigningInMemoryKeyPassword=${{ secrets.SIGNING_PASSWORD }}
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      # Attach the per-target artifacts for BOTH :core and :koog (AAR, jvm jar,
      # ios/macos klibs, wasm klib) to the GitHub release page.
      - name: Attach per-target artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=$(mktemp -d)
          find ~/.m2/repository/com/kmpile -type f \( \
            -name "*-${{ github.ref_name }}.jar" -o \
            -name "*-${{ github.ref_name }}.klib" -o \
            -name "*-${{ github.ref_name }}.aar" \) -exec cp {} "$dir/" \;
          echo "Uploading:"; ls -1 "$dir"
          gh release upload "${{ github.ref_name }}" "$dir"/* --clobber
