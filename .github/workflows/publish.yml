name: Publish

# Publishes a SNAPSHOT of main to the Central Portal snapshots repo
# (https://central.sonatype.com/repository/maven-snapshots/) on every push, so
# every commit is consumable without shipping anything immutable. Version =
# <upstream llama.cpp tag>.<next binding revision>-SNAPSHOT, e.g.
# b9592.1-SNAPSHOT — a stable coordinate consumers resolve to the newest build
# (Gradle: cacheChangingModulesFor(0, "seconds")). The vanniktech plugin routes
# -SNAPSHOT versions to the snapshots repo automatically.
#
# Immutable releases to Maven Central are DISABLED for now. To re-enable:
# restore `release: types: [released, prereleased]` below, publish with
# -PVERSION_NAME=<tag> on release events, and re-add a step uploading the
# per-target jars/klibs/aar from ~/.m2 to the release page.
on:
  push:
    branches: [main]
  # sync-llamacpp.yml dispatches this after its bump commit: GITHUB_TOKEN
  # pushes don't trigger `push` workflows.
  workflow_dispatch:

# Rapid pushes supersede each other's snapshot.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-native:
    name: llamakmp-jni (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   platform: macos }
          - { os: ubuntu-latest,  platform: linux }
          - { os: windows-latest, platform: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Vulkan tooling, as upstream llama.cpp's release CI: plain distro packages
      # on Ubuntu (no LunarG apt repo), LunarG SDK installer on Windows pinned to
      # whatever the submodule's own release.yml pins — it tracks upstream bumps
      # by construction instead of carrying our own copy of the version.
      - name: Install Vulkan tooling (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev spirv-headers
      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $v = (Select-String -Path native/cpp/llama.cpp/.github/workflows/release.yml -Pattern 'VULKAN_VERSION:\s*([0-9.]+)').Matches[0].Groups[1].Value
          if (-not $v) { Write-Host "::warning::VULKAN_VERSION not found in upstream release.yml, using fallback"; $v = "1.4.313.2" }
          Write-Host "Vulkan SDK $v (upstream pin)"
          curl.exe -L -o "$env:RUNNER_TEMP\VulkanSDK.exe" "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe"
          & "$env:RUNNER_TEMP\VulkanSDK.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$v"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$v\Bin"
      # As upstream: warm rebuilds of unchanged llama.cpp sources come from ccache.
      # Not on Windows — MSVC needs the LLVM toolchain for ccache (upstream's CI
      # skips it there too).
      - name: ccache
        if: matrix.platform != 'windows'
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: desktop-jni-${{ matrix.platform }}
      - name: Build desktop JNI native
        run: ./gradlew :core:copyDesktopJni --console=plain
      # On Windows the daemon's file locks make setup-java's post-job Gradle
      # cache save fail (tar exit 2); stop it so the cache actually persists.
      - name: Stop Gradle daemon (release locks for cache save)
        if: matrix.platform == 'windows'
        run: ./gradlew --stop
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: core/build/generated/jvmNativeResources/native

  publish:
    name: Snapshot build and publish
    needs: [desktop-native]
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The publish builds the Android AAR (via :native's CMake/NDK build), and macOS
      # runners ship without the Android SDK — install it plus the pinned NDK/CMake.
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages (NDK + CMake pinned by :native)
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
      - name: Download desktop natives (macOS + Linux + Windows)
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: core/build/generated/jvmNativeResources/native
      # Speeds up the NDK/ninja Android native build; the Xcode-generator iOS
      # build ignores compiler launchers and builds cold regardless.
      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: publish-android
      - name: Build iOS artifacts
        run: cd native/cpp && sh build-ios.sh
      - name: Resolve snapshot version (next binding revision on the upstream tag)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout's submodules are shallow and tag-less, so git describe
          # can't name the pinned commit; resolve its tag from upstream's refs
          # instead (ls-remote lists them without fetching objects).
          sha=$(git -C native/cpp/llama.cpp rev-parse HEAD)
          base=$(git ls-remote --tags https://github.com/ggml-org/llama.cpp.git \
            | awk -v sha="$sha" '$1 == sha && $2 !~ /\^\{\}$/ {sub("refs/tags/","",$2); print $2}' | tail -1)
          [ -n "$base" ] || { echo "::error::no upstream tag points at llama.cpp commit $sha"; exit 1; }
          # If bNNNN.N releases ever ship, the snapshot moves past the highest one.
          last=$(gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E "^${base}\.[0-9]+$" | sed "s/^${base}\.//" | sort -n | tail -1)
          version="${base}.$(( ${last:-0} + 1 ))-SNAPSHOT"
          echo "version=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Build and publish are separate steps (same runner, warm Gradle state) so
      # compile output and publish/signing/upload output land in separate logs
      # and a failure is attributable at a glance.
      - name: Build all targets
        run: >
          ./gradlew assemble
          -PllamakmpPrebuiltNatives=true
          -PVERSION_NAME=${{ steps.ver.outputs.version }}
      - name: Publish to Central snapshots (all modules, all platforms)
        run: >
          ./gradlew publishToMavenCentral
          -PllamakmpPrebuiltNatives=true
          -PVERSION_NAME=${{ steps.ver.outputs.version }}
          -PmavenCentralUsername=${{ secrets.MAVEN_USERNAME }}
          -PmavenCentralPassword=${{ secrets.MAVEN_PASSWORD }}
          -PsigningInMemoryKeyPassword=${{ secrets.SIGNING_PASSWORD }}
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

  # The sync bump is pushed with GITHUB_TOKEN, which can't trigger `push` runs,
  # so sync dispatches this workflow instead — but GitHub excludes
  # workflow_dispatch check suites from the commit's status-check rollup, leaving
  # bump commits with NO icon on the commits page. Post a plain commit status
  # (those DO roll up) so dispatched runs mark the commit green/red like a
  # normal push run would.
  commit-status:
    name: Commit status (dispatched runs)
    needs: [desktop-native, publish]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          case "${{ join(needs.*.result, ',') }}" in *failure*|*cancelled*) state=failure ;; esac
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context="Publish" \
            -f description="Snapshot build and publish (dispatched run)" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
